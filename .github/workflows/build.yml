name: Build Spigot Versions

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:         # Manual trigger
    inputs:
      force_rebuild:
        description: 'Force rebuild all versions'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Java 25 (for newer MC versions)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          java-path: java25

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download BuildTools if missing
        run: |
          if [ ! -f tools/BuildTools.jar ] || [ $(stat -c%s tools/BuildTools.jar) -lt 1000000 ]; then
            echo "Downloading BuildTools.jar..."
            curl -L -o tools/BuildTools.jar \
              "https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar"
          fi
          echo "BuildTools.jar size: $(stat -c%s tools/BuildTools.jar) bytes"

      - name: Build versions
        run: |
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          node --experimental-specifier-resolution=node --loader ts-node/esm src/check.ts
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload JARs as release assets
        if: success()
        run: |
          # Create a release for each newly built version
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            const versions = JSON.parse(fs.readFileSync('versions.json', 'utf-8'));
            const builtToday = Object.entries(versions.versions)
              .filter(([v, info]) => {
                const d = new Date(info.timestamp);
                const now = new Date();
                return (now.getTime() - d.getTime()) < 3600000; // built in last hour
              });

            for (const [ver, info] of builtToday) {
              const tag = 'spigot-' + ver;
              const jarPath = 'builds/' + ver + '/' + info.filename;
              if (!fs.existsSync(jarPath)) continue;

              try {
                // Delete existing release if present
                execSync('gh release delete ' + tag + ' -y --cleanup-tag', { stdio: 'ignore' });
              } catch {}

              // Create release with JAR
              execSync(
                'gh release create ' + tag + ' ' + jarPath +
                ' --title \"Spigot ' + ver + '\"' +
                ' --notes \"SpigotMC BuildTools build for Minecraft ' + ver + '\"' +
                ' --latest=' + (ver === Object.keys(versions.versions).sort().pop() ? 'true' : 'false'),
                { stdio: 'inherit' }
              );
              console.log('Created release: ' + tag);
            }
          "
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update versions.json in repo
        run: |
          git add versions.json builds/
          git diff --cached --quiet || git commit -m "Update builds [skip ci]"
          git push
