name: Build Spigot Versions

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild every version
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: spigot-releases
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - id: versions
        run: echo "versions=$(node --loader ts-node/esm src/release.ts list)" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        version: ${{ fromJSON(needs.discover.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '16'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: npm install
      - run: git config --global user.name 'github-actions[bot]' && git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Download current BuildTools
        run: curl --fail --location --retry 3 -o tools/BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
      - name: Build and publish
        run: node --loader ts-node/esm src/release.ts
        env:
          GH_TOKEN: ${{ github.token }}
          MC_VERSION: ${{ matrix.version }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: version-${{ matrix.version }}
          path: result/*.json
          if-no-files-found: ignore
          retention-days: 1

  update-index:
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: version-*
          path: result
          merge-multiple: true
      - name: Update versions.json
        run: |
          mkdir -p result
          node -e "const fs=require('fs');const p='versions.json';const data=JSON.parse(fs.readFileSync(p));for(const f of fs.readdirSync('result').filter(f=>f.endsWith('.json'))){const e=JSON.parse(fs.readFileSync('result/'+f));data.versions[e.version]=e}data.lastUpdated=new Date().toISOString();fs.writeFileSync(p,JSON.stringify(data,null,2)+'\n')"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add versions.json
          git diff --cached --quiet || (git commit -m 'Update versions.json [skip ci]' && git push)
